<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Service-day copy layout fixture</title>
  </head>
  <body>
    <main class="app-shell">
      <div class="trips-workspace">
        <section class="workflow-section" aria-label="Runtimes section">
          <div class="section-title"><div><h2>Runtimes</h2></div><div class="section-actions section-header-actions"><label class="header-field">Pattern<select><option>Outbound</option></select></label><div class="menu-button"><button class="menu-trigger">Profile: Weekday ▾</button></div><span class="action-separator"></span><button>Add</button><button>Discard</button><button class="primary">Save</button><span class="action-separator"></span><div class="menu-button"><button class="menu-trigger menu-trigger--icon" aria-label="Runtime actions" title="Runtime actions"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></div></div></div>
          <div class="runtime-editor">
            <div class="table-scroll data-grid runtime-table"><table><thead><tr><th>From</th><th>To</th></tr></thead><tbody><tr><td>06:00</td><td>09:00</td></tr></tbody></table></div>
          </div>
        </section>
        <section class="workflow-section" aria-label="Trips section">
          <div class="section-title"><div><h2>Trips</h2></div><div class="section-actions section-header-actions"><div class="menu-button"><button class="menu-trigger">Profile: Default ▾</button></div><span class="action-separator"></span><div class="menu-button"><button class="menu-trigger menu-trigger--icon" aria-label="Trip actions" title="Trip actions"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></div></div></div>
        </section>
      </div>
    </main>
  </body>
</html>
