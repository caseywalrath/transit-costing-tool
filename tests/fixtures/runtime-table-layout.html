<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/ui/styles/index.css" />
    <title>Runtime table layout fixture</title>
  </head>
  <body>
    <main class="app-shell">
      <div class="table-scroll runtime-table">
        <table role="grid" aria-label="Runtimes">
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
              <th><span class="segment-header">North Terminal → Federal &amp; 32nd</span></th>
              <th><span class="segment-header">Federal &amp; 32nd → South Terminal</span></th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td role="gridcell" class="grid-cell" tabindex="0" data-cell="From time"><span>6:00</span></td>
              <td role="gridcell" class="grid-cell" tabindex="-1" data-cell="To time"><span>9:00</span></td>
              <td role="gridcell" class="grid-cell" tabindex="-1" data-cell="First segment runtime"><span>:08</span></td>
              <td role="gridcell" class="grid-cell" tabindex="-1" data-cell="Second segment runtime"><span>:11</span></td>
              <td>×</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
